name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "java-assignment/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "java-assignment/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: java-assignment

jobs:
  build-and-test:
    name: Build & Test (JVM)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build & run tests
        run: ./mvnw verify -B -ntp

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: java-assignment/target/site/jacoco/
          retention-days: 14

      - name: Coverage summary (console)
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ -f "$CSV" ]; then
            awk -F',' 'NR>1 {miss+=$4; cov+=$5} END {
              total=miss+cov
              pct=(total>0) ? cov*100/total : 0
              printf "Instruction coverage: %.1f%% (%d / %d)\n", pct, cov, total
            }' "$CSV"
          fi

  package:
    name: Package (fast-jar)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Package (skip tests — already ran)
        run: ./mvnw package -B -ntp -DskipTests

      - name: Upload fast-jar
        uses: actions/upload-artifact@v4
        with:
          name: quarkus-fast-jar
          path: |
            java-assignment/target/quarkus-app/
          retention-days: 7
